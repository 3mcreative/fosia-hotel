<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOSIA Hotels — Event</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#F2F1F1;color:#2B3843;font-family:"Kumbh Sans",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(760px,100%);background:#fff;border-radius:28px;padding:44px;box-shadow:0 24px 70px rgba(43,56,67,.14)}.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.6}h1{font-size:42px;line-height:1.15;margin:10px 0 14px}p{line-height:1.7;color:#66727c}.button{display:inline-flex;padding:13px 20px;border-radius:28px;background:#2B3843;color:#fff;text-decoration:none}@media(max-width:600px){.card{padding:28px;border-radius:22px}h1{font-size:34px}}</style></head><body><main class="card"><div class="eyebrow">FOSIA Hotels · Event</div><h1 id="title">Event Detail</h1><p>This is the front-end detail route for the selected event. Replace this placeholder with the final CMS or Laravel/React post template when the backend is connected.</p><a class="button" href="index.html#events">Back to Our Events</a></main><script>const p=new URLSearchParams(location.search),slug=p.get('post')||'';const title=slug.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());document.getElementById('title').textContent=title||'Event Detail';</script></body></html>
